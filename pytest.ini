[pytest]
testpaths = tests
addopts = -q -m "not endtoend"

# Matched by message, not by class: urllib3's LibreSSL warning only exists on
# some builds, and naming the class breaks collection where it does not.
filterwarnings =
    ignore:.*OpenSSL.*:Warning

markers =
    endtoend: نیازمند ollama در حال اجرا؛ پاسخ مدل را می‌سنجد، نه فقط بازیابی
